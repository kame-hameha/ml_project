<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teilzielkontrolle 3 – Faltungsnetze und Modellbewertung</title>
<style>
:root{--blau:#1f5f99;--blau-hell:#e8f0f8;--orange:#d9731a;--gruen:#2e8b57;--rot:#c0392b;--grau:#5f6b76;--linie:#d5dde5;--hg:#f7f9fb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:#1d2833;line-height:1.45;font-size:15px}
header{background:var(--blau);color:#fff;padding:12px 18px;position:sticky;top:0;z-index:2}
header .ls{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.03em}header h1{margin:2px 0 4px;font-size:20px}
#fortschritt{height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}#fortschritt div{height:100%;background:#ffd18c;width:0;transition:width .3s}
main{max-width:900px;margin:0 auto;padding:12px 18px 30px}
.frage{border:1px solid var(--linie);border-radius:10px;padding:12px 14px;margin:12px 0;background:#fff}
.frage.ok{border-color:var(--gruen);background:#f2fbf5}.frage.teil{border-color:var(--orange);background:#fff8ef}.frage.falsch{border-color:var(--rot);background:#fdf3f2}
.kopfzeile{font-size:12px;color:var(--grau);margin-bottom:4px}.text{font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;margin:2px 0}.opt:hover{background:var(--hg)}
.opt.r{background:#dff2e6}.opt.f{background:#f8dcd8}
button{font:inherit;background:var(--blau);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;margin:6px 4px 0 0}
button.zweit{background:#fff;color:var(--blau);border:1px solid var(--blau)}button:disabled{opacity:.45;cursor:default}
select,input{font:inherit;padding:4px 6px;border:1px solid var(--linie);border-radius:5px}
.paar{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;align-items:center;margin:4px 0}
.paar select{width:100%}.paar.r select{background:#dff2e6}.paar.f select{background:#f8dcd8}
.schritt{display:flex;align-items:center;gap:6px;border:1px solid var(--linie);border-radius:6px;padding:5px 8px;margin:4px 0;background:#fff}
.schritt span{flex:1}.schritt button{margin:0;padding:2px 8px}.schritt.r{background:#dff2e6}.schritt.f{background:#f8dcd8}
.erkl{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--blau-hell);font-size:14px;display:none}
.mono{font-family:ui-monospace,"DejaVu Sans Mono",Consolas,monospace}
#ergebnis{border:2px solid var(--blau);border-radius:10px;padding:14px;margin-top:18px;background:var(--blau-hell)}
#ergebnis textarea{width:100%;height:64px;font-family:ui-monospace,monospace;font-size:13px}
.gross{font-size:26px;font-weight:700}
</style></head><body>
<header><div class="ls">Lernsituation KI-Sichtprüfstation · nach Doppelstunde 7</div><h1>Teilzielkontrolle 3 – Faltungsnetze und Modellbewertung</h1><div id="fortschritt"><div></div></div></header>
<main>
<p>Beantworte jede Frage und klicke auf <b>Prüfen</b>. Gewertet wird der erste Versuch. Am Ende erhältst du einen Ergebniscode für deine Lehrkraft.</p>
<div id="fragen"></div>
<div id="ergebnis">
 <div><label>Name: <input id="name" placeholder="Vorname Nachname"></label></div>
 <div style="margin-top:8px">Punkte: <span class="gross" id="punkte">0</span> von <span id="max"></span> <span id="urteil"></span></div>
 <textarea id="code" readonly></textarea>
 <button id="kopieren">Ergebnis kopieren</button><button class="zweit" id="neu">Neu starten</button>
</div>
</main>
<script>
const DATEN={"kurz": "TZK3", "titel": "Teilzielkontrolle 3 – Faltungsnetze und Modellbewertung", "ds": "nach Doppelstunde 7", "fragen": [{"typ": "einfach", "frage": "Warum eignet sich ein CNN für Bilder besser als ein FCNN?", "optionen": ["Es nutzt die Nachbarschaft der Pixel und wendet dieselben Filter überall an – weniger Parameter, robust gegen Verschiebung.", "Es rechnet mit höherer Genauigkeit (float64).", "Es braucht keine Trainingsdaten.", "Es wandelt das Bild zuerst in einen Vektor um."], "richtig": 0, "erklaerung": "Gewichtsteilung (shared weights) und lokale Verbindungen sind die Kernidee."}, {"typ": "zahl", "frage": "Bildausschnitt [[0,0,1],[0,0,1],[0,0,1]] wird mit dem Kernel [[−1,0,1],[−1,0,1],[−1,0,1]] gefaltet. Ergebnis?", "richtig": 3, "toleranz": 0, "einheit": "", "erklaerung": "Nur die rechte Spalte ist 1 und wird mit +1 multipliziert: 1 + 1 + 1 = 3 → senkrechte Kante erkannt."}, {"typ": "zahl", "frage": "Wie viele Parameter hat <span class='mono'>Conv2D(32, 3)</span>, wenn die Eingabe 16 Kanäle hat?", "richtig": 4640, "toleranz": 0, "einheit": "Parameter", "erklaerung": "32 Filter · (3 · 3 · 16 Gewichte + 1 Bias) = 32 · 145 = 4640."}, {"typ": "zahl", "frage": "Ein 96 × 96-Bild durchläuft dreimal <span class='mono'>MaxPooling2D()</span> (2 × 2). Wie breit ist die Merkmalskarte danach?", "richtig": 12, "toleranz": 0, "einheit": "Pixel", "erklaerung": "96 → 48 → 24 → 12."}, {"typ": "einfach", "frage": "Was bewirkt <span class='mono'>padding=\"same\"</span>?", "optionen": ["Die Merkmalskarte bleibt so groß wie die Eingabe (Rand wird mit Nullen aufgefüllt).", "Alle Filter erhalten dieselben Gewichte.", "Das Bild wird auf die gleiche Größe wie der Kernel verkleinert.", "Es wird keine Aktivierungsfunktion verwendet."], "richtig": 0, "erklaerung": "Ohne Padding („valid“) schrumpft die Karte bei 3 × 3 um je 2 Pixel."}, {"typ": "zuordnung", "frage": "Ordne jeder Schicht ihre Aufgabe zu.", "paare": [["Rescaling(1/255)", "normiert die Pixelwerte auf 0 … 1"], ["Conv2D", "findet lokale Muster wie Kanten und Ecken"], ["MaxPooling2D", "verkleinert die Merkmalskarten"], ["GlobalAveragePooling2D", "macht aus jeder Merkmalskarte eine Zahl"], ["Dense(…, softmax)", "entscheidet über die Klasse"]], "erklaerung": "So ist das CNN in Notebook 12 aufgebaut."}, {"typ": "einfach", "frage": "In der Konfusionsmatrix steht in Zeile <b>Kreis</b>, Spalte <b>Quadrat</b> die Zahl 7. Was heißt das?", "optionen": ["7 Kreise wurden fälschlich als Quadrat erkannt.", "7 Quadrate wurden fälschlich als Kreis erkannt.", "7 Kreise wurden richtig erkannt.", "Das Modell ist zu 7 % unsicher."], "richtig": 0, "erklaerung": "Zeile = tatsächliche Klasse, Spalte = Vorhersage."}, {"typ": "zahl", "frage": "Von 66 echten Dreiecken erkennt das Modell 60 richtig. Wie groß ist der <b>Recall</b> für Dreieck (in %)?", "richtig": 90.9, "toleranz": 0.6, "einheit": "%", "erklaerung": "Recall = richtig gefunden / alle echten = 60 / 66 ≈ 90,9 %."}, {"typ": "einfach", "frage": "Ein durchgerutschtes fehlerhaftes Teil (Schlupf) kostet 250 €, ein unnötig aussortiertes 8 €. Wie stellst du die Prüfstation ein?", "optionen": ["Schwelle für „n. i. O.“ senken, damit der Recall für fehlerhafte Teile steigt", "Schwelle erhöhen, damit weniger Teile aussortiert werden", "nur auf die Accuracy achten", "die Klasse „n. i. O.“ aus dem Training entfernen"], "richtig": 0, "erklaerung": "Lieber etwas mehr Pseudoausschuss als teurer Schlupf."}, {"typ": "mehrfach", "frage": "Kreis und Quadrat werden oft verwechselt. Was sind sinnvolle Gegenmaßnahmen? (mehrere richtig)", "optionen": ["mehr und abwechslungsreichere Bilder dieser beiden Klassen aufnehmen", "größere Eingabebilder verwenden, damit Ecken besser sichtbar sind", "Augmentierung mit Drehung und Zoom nutzen", "die Testbilder mit ins Training nehmen", "die Klasse Quadrat löschen"], "richtig": [0, 1, 2], "erklaerung": "Testbilder im Training schönen nur die Zahl, verbessern aber nicht das Modell."}]};
const $=id=>document.getElementById(id);
const mische=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let stand=[];
function baue(){
  stand=DATEN.fragen.map(()=>({punkte:null}));$('max').textContent=DATEN.fragen.length;
  $('fragen').innerHTML='';
  DATEN.fragen.forEach((q,n)=>{
    const d=document.createElement('div');d.className='frage';d.id='q'+n;
    let h=`<div class="kopfzeile">Frage ${n+1} von ${DATEN.fragen.length}${q.typ==='mehrfach'?' · mehrere Antworten möglich':''}</div><div class="text">${q.frage}</div>`;
    if(q.typ==='einfach'||q.typ==='mehrfach'){
      q._ord=mische([...q.optionen.keys()]);
      h+=q._ord.map(i=>`<label class="opt" data-i="${i}"><input type="${q.typ==='einfach'?'radio':'checkbox'}" name="a${n}" value="${i}"><span>${q.optionen[i]}</span></label>`).join('');
    }else if(q.typ==='zahl'){
      h+=`<input type="text" inputmode="decimal" id="z${n}" style="width:140px"> ${q.einheit||''}<br>`;
    }else if(q.typ==='zuordnung'){
      const rechts=mische(q.paare.map(p=>p[1]));
      h+=q.paare.map((p,i)=>`<div class="paar" id="p${n}_${i}"><span>${p[0]}</span><select><option value="">– bitte wählen –</option>${rechts.map(r=>`<option>${r}</option>`).join('')}</select></div>`).join('');
    }else if(q.typ==='reihenfolge'){
      q._liste=mische([...q.schritte.keys()]);
      h+=`<div id="r${n}"></div>`;
    }
    h+=`<button id="b${n}">Prüfen</button><div class="erkl" id="e${n}"></div>`;
    d.innerHTML=h;$('fragen').appendChild(d);
    if(q.typ==='reihenfolge')zeigeListe(n);
    $('b'+n).onclick=()=>pruefe(n);
  });
  aktualisiere();
}
function zeigeListe(n,markiere){
  const q=DATEN.fragen[n];
  $('r'+n).innerHTML=q._liste.map((s,k)=>`<div class="schritt ${markiere?(s===k?'r':'f'):''}"><b>${k+1}.</b><span>${q.schritte[s]}</span>${markiere?'':`<button class="zweit" data-k="${k}" data-d="-1">▲</button><button class="zweit" data-k="${k}" data-d="1">▼</button>`}</div>`).join('');
  $('r'+n).querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,d=+b.dataset.d,j=k+d;if(j<0||j>=q._liste.length)return;[q._liste[k],q._liste[j]]=[q._liste[j],q._liste[k]];zeigeListe(n)});
}
function zahl(s){return parseFloat(String(s).replace(/\s/g,'').replace(/\./g,'').replace(',','.'))}
function pruefe(n){
  const q=DATEN.fragen[n],box=$('q'+n);let p=0;
  if(q.typ==='einfach'){
    const w=box.querySelector('input:checked');if(!w){alert('Bitte eine Antwort wählen.');return}
    p=+w.value===q.richtig?1:0;
    box.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;if(i===q.richtig)o.classList.add('r');else if(o.querySelector('input').checked)o.classList.add('f')});
  }else if(q.typ==='mehrfach'){
    const gew=[...box.querySelectorAll('input:checked')].map(e=>+e.value);if(!gew.length){alert('Bitte mindestens eine Antwort wählen.');return}
    const soll=new Set(q.richtig);p=(gew.length===soll.size&&gew.every(g=>soll.has(g)))?1:0;
    box.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i,c=o.querySelector('input').checked;if(soll.has(i))o.classList.add('r');else if(c)o.classList.add('f')});
  }else if(q.typ==='zahl'){
    let v=$('z'+n).value.trim();if(!v){alert('Bitte eine Zahl eingeben.');return}
    let x=parseFloat(v.replace(',','.'));if(/^\d{1,3}(\.\d{3})+$/.test(v))x=zahl(v);
    p=Math.abs(x-q.richtig)<=q.toleranz+1e-9?1:0;
  }else if(q.typ==='zuordnung'){
    let r=0;q.paare.forEach((pp,i)=>{const z=$(`p${n}_${i}`),ok=z.querySelector('select').value===pp[1];if(ok)r++;z.classList.add(ok?'r':'f')});
    p=r/q.paare.length;
  }else if(q.typ==='reihenfolge'){
    const r=q._liste.filter((s,k)=>s===k).length;p=r===q._liste.length?1:Math.round(r/q._liste.length*2)/4;zeigeListe(n,true);
  }
  stand[n].punkte=p;
  box.classList.add(p>=1?'ok':p>0?'teil':'falsch');
  box.querySelectorAll('input,select').forEach(e=>e.disabled=true);$('b'+n).disabled=true;
  const e=$('e'+n);e.style.display='block';
  let loesung='';
  if(q.typ==='zahl'&&p<1)loesung=`Richtig: <b>${String(q.richtig).replace('.',',')} ${q.einheit||''}</b>. `;
  if(q.typ==='zuordnung'&&p<1)loesung='Richtig: '+q.paare.map(pp=>`${pp[0]} → <b>${pp[1]}</b>`).join('; ')+'. ';
  if(q.typ==='reihenfolge'&&p<1)loesung='Richtig: '+q.schritte.map((s,i)=>`${i+1}. ${s}`).join(' → ')+'. ';
  e.innerHTML=(p>=1?'✅ <b>Richtig!</b> ':p>0?`🟠 <b>Teilweise richtig (${String(p).replace('.',',')} P.).</b> `:'❌ <b>Leider falsch.</b> ')+loesung+(q.erklaerung||'');
  aktualisiere();
}
function aktualisiere(){
  const fertig=stand.filter(s=>s.punkte!==null).length,summe=stand.reduce((a,s)=>a+(s.punkte||0),0),max=DATEN.fragen.length;
  document.querySelector('#fortschritt div').style.width=(fertig/max*100)+'%';
  $('punkte').textContent=String(Math.round(summe*100)/100).replace('.',',');
  const quote=summe/max;
  $('urteil').innerHTML=fertig<max?`<span style="color:var(--grau)">(${fertig} von ${max} beantwortet)</span>`:quote>=0.7?' – <b style="color:var(--gruen)">Teilziel erreicht ✔</b>':' – <b style="color:var(--rot)">Teilziel noch nicht erreicht – wiederhole die markierten Themen.</b>';
  const falsch=stand.map((s,i)=>s.punkte!==null&&s.punkte<1?'F'+(i+1):null).filter(Boolean);
  const jetzt=new Date();const zeit=jetzt.toLocaleDateString('de-DE')+' '+jetzt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  $('code').value=`${DATEN.kurz} | ${$('name').value||'(Name)'} | ${String(Math.round(summe*100)/100).replace('.',',')}/${max} Punkte (${Math.round(quote*100)} %) | ${fertig}/${max} beantwortet | nicht voll richtig: ${falsch.join(', ')||'–'} | ${zeit}`;
}
$('name').oninput=aktualisiere;
$('kopieren').onclick=()=>{const t=$('code');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{$('kopieren').textContent='Kopiert ✔'},()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}};
$('neu').onclick=()=>{if(confirm('Alle Antworten löschen und neu beginnen?')){baue();window.scrollTo(0,0)}};
baue();
</script></body></html>
