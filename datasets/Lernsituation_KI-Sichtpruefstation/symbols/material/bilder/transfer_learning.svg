<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" font-family="system-ui,Segoe UI,Roboto,Ubuntu,sans-serif">
<defs><marker id="pf" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs>
<rect width="980" height="300" fill="#fff"/>
<text x="490" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1f5f99">Transfer Learning: vortrainiertes Wissen wiederverwenden</text>
<rect x="20" y="70" width="120" height="120" rx="6" fill="#f4f6f8" stroke="#5f6b76"/><circle cx="80" cy="130" r="35" fill="none" stroke="#1d2833" stroke-width="6"/>
<text x="80" y="215" text-anchor="middle" font-size="13">Bild 128 × 128 × 3</text>
<rect x="180" y="55" width="430" height="150" rx="14" fill="#eef1f4" stroke="#5f6b76" stroke-width="2" stroke-dasharray="7 5"/>
<text x="395" y="82" text-anchor="middle" font-size="15" font-weight="700">MobileNetV2 – vortrainiert auf ImageNet (1,4 Mio. Bilder)</text>
<g fill="#cfd8e2" stroke="#5f6b76"><rect x="205" y="100" width="56" height="80" rx="5"/><rect x="275" y="105" width="50" height="70" rx="5"/><rect x="339" y="110" width="44" height="60" rx="5"/><rect x="397" y="115" width="38" height="50" rx="5"/><rect x="449" y="119" width="32" height="42" rx="5"/><rect x="495" y="123" width="26" height="34" rx="5"/><rect x="535" y="126" width="20" height="28" rx="5"/></g>
<text x="582" y="146" font-size="22">❄</text>
<text x="395" y="198" text-anchor="middle" font-size="12" fill="#5f6b76">eingefroren (trainable = False) · kennt Kanten, Ecken, Formen</text>
<rect x="660" y="85" width="90" height="90" rx="10" fill="#cfd8e2" stroke="#5f6b76"/><text x="705" y="125" text-anchor="middle" font-size="13" font-weight="600">Merkmale</text><text x="705" y="143" text-anchor="middle" font-size="12" fill="#5f6b76">1280 Zahlen</text>
<rect x="790" y="70" width="170" height="120" rx="12" fill="#fff7ec" stroke="#d9731a" stroke-width="2"/>
<text x="875" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#d9731a">Neuer Kopf</text>
<text x="875" y="118" text-anchor="middle" font-size="12">Dropout(0.2)</text><text x="875" y="138" text-anchor="middle" font-size="12">Dense(Klassen, softmax)</text>
<text x="875" y="166" text-anchor="middle" font-size="12" fill="#d9731a">wird trainiert 🔥</text>
<g stroke="#5f6b76" stroke-width="2" marker-end="url(#pf)"><path d="M142,130 L174,130"/><path d="M612,130 L654,130"/><path d="M752,130 L784,130"/></g>
<rect x="20" y="232" width="940" height="58" rx="8" fill="#e8f0f8"/>
<text x="36" y="255" font-size="13"><tspan font-weight="700" fill="#1f5f99">Schritt 1 – Merkmalsextraktion:</tspan> Basis eingefroren, nur der Kopf lernt. Auf dem Pi: Merkmale einmal vorab berechnen → Training in Sekunden.</text>
<text x="36" y="277" font-size="13"><tspan font-weight="700" fill="#1f5f99">Schritt 2 – Feinabstimmung (optional):</tspan> obere Schichten der Basis freigeben, mit sehr kleiner Lernrate weitertrainieren.</text>
</svg>
