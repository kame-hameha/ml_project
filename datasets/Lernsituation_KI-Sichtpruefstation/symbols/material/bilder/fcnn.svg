<text x="480" y="314" text-anchor="middle" font-size="12" fill="#5f6b76">Nachteil: Jedes Pixel hat sein eigenes Gewicht – verschiebt sich das Symbol, sieht das Netz „ganz andere“ Eingänge.</text>
