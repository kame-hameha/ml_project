<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui,Segoe UI,Roboto,Ubuntu,sans-serif">
<defs>
 <marker id="pf" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker>
 <linearGradient id="band" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4b5560"/><stop offset="1" stop-color="#2c333a"/></linearGradient>
 <radialGradient id="licht" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1000" height="470" fill="#fff"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2833">Szenario: KI-Sichtprüfstation am Ende der Montagelinie</text>
<!-- Lichtkegel -->
<path d="M400,140 L330,300 L560,300 L490,140 z" fill="url(#licht)"/>
<!-- Stativ + Kamera -->
<rect x="590" y="70" width="10" height="230" fill="#9aa5b1"/>
<rect x="440" y="70" width="160" height="10" fill="#9aa5b1"/>
<rect x="415" y="100" width="60" height="38" rx="6" fill="#1d2833"/>
<circle cx="445" cy="140" r="11" fill="#1f5f99" stroke="#1d2833" stroke-width="4"/>
<rect x="440" y="80" width="10" height="20" fill="#9aa5b1"/>
<ellipse cx="445" cy="150" rx="48" ry="8" fill="none" stroke="#f2c14e" stroke-width="5"/>
<text x="340" y="108" font-size="14" font-weight="600" text-anchor="end">USB-Kamera</text>
<text x="340" y="126" font-size="12" fill="#5f6b76" text-anchor="end">+ LED-Ringlicht (konstante Beleuchtung)</text>
<!-- Foerderband -->
<rect x="60" y="300" width="640" height="26" rx="13" fill="url(#band)"/>
<circle cx="73" cy="313" r="11" fill="#9aa5b1"/><circle cx="687" cy="313" r="11" fill="#9aa5b1"/>
<text x="70" y="352" font-size="13" fill="#5f6b76">Förderband → Teile mit Prüfmerkmal</text>
<g stroke="#1d2833" stroke-width="3" fill="none">
 <rect x="110" y="262" width="54" height="38" rx="4" fill="#f4f6f8"/><path d="M125,270 L149,292 M149,270 L125,292"/>
 <rect x="230" y="262" width="54" height="38" rx="4" fill="#f4f6f8"/><circle cx="257" cy="281" r="12"/>
 <rect x="418" y="262" width="54" height="38" rx="4" fill="#fff" stroke="#d9731a"/><path d="M445,268 L460,293 L430,293 z"/>
</g>
<path d="M175,281 L215,281" stroke="#5f6b76" stroke-width="2" marker-end="url(#pf)"/>
<!-- Raspberry Pi -->
<rect x="640" y="140" width="130" height="80" rx="8" fill="#e3f4ea" stroke="#2e8b57" stroke-width="2"/>
<text x="705" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#2e8b57">Raspberry Pi 5</text>
<text x="705" y="190" text-anchor="middle" font-size="12">TFLite-Modell</text>
<text x="705" y="207" text-anchor="middle" font-size="12">Skript 20</text>
<path d="M476,118 C560,118 580,160 636,170" stroke="#5f6b76" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#pf)"/>
<text x="560" y="112" font-size="11" fill="#5f6b76">Bild</text>
<!-- Ampel -->
<rect x="820" y="70" width="34" height="92" rx="8" fill="#1d2833"/>
<circle cx="837" cy="90" r="10" fill="#c0392b"/><circle cx="837" cy="116" r="10" fill="#f2c14e" opacity=".35"/><circle cx="837" cy="142" r="10" fill="#2e8b57" opacity=".35"/>
<rect x="833" y="162" width="8" height="40" fill="#9aa5b1"/>
<path d="M772,165 L812,130" stroke="#5f6b76" stroke-width="2" marker-end="url(#pf)"/>
<text x="870" y="96" font-size="12">rot: Ausschuss</text><text x="870" y="121" font-size="12">gelb: unsicher</text><text x="870" y="146" font-size="12">grün: i. O.</text>
<!-- Weiche -->
<path d="M772,205 C800,250 760,270 735,292" stroke="#5f6b76" stroke-width="2" fill="none" marker-end="url(#pf)"/>
<text x="790" y="250" font-size="12" fill="#5f6b76">GPIO-Signal</text>
<rect x="705" y="292" width="40" height="12" rx="3" fill="#d9731a" transform="rotate(-25 705 298)"/>
<text x="700" y="285" font-size="12" text-anchor="end" fill="#d9731a" font-weight="600">Weiche</text>
<!-- Behaelter -->
<g font-size="13" text-anchor="middle">
 <path d="M740,380 L760,450 L840,450 L860,380 z" fill="#e3f4ea" stroke="#2e8b57" stroke-width="2"/><text x="800" y="420" font-weight="600" fill="#2e8b57">Klasse A</text>
 <path d="M870,380 L885,450 L960,450 L975,380 z" fill="#fbe4e1" stroke="#c0392b" stroke-width="2"/><text x="922" y="410" font-weight="600" fill="#c0392b">Klasse B /</text><text x="922" y="428" font-weight="600" fill="#c0392b">Nacharbeit</text>
</g>
<path d="M712,330 C740,350 770,360 790,375" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#pf)"/>
<path d="M712,330 C800,330 880,340 915,375" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#pf)"/>
<!-- Info-Kasten -->
<rect x="60" y="380" width="620" height="76" rx="10" fill="#e8f0f8"/>
<text x="76" y="404" font-size="13" font-weight="700" fill="#1f5f99">Im Unterricht:</text>
<text x="176" y="404" font-size="13">Symbole Kreuz · Kreis · Dreieck · Quadrat stehen stellvertretend für</text>
<text x="76" y="424" font-size="13">Teiletypen, Fehlerarten oder Prüfergebnisse. Mit Skript 00 lassen sich jederzeit eigene</text>
<text x="76" y="444" font-size="13">Klassen aufnehmen, z. B. Schraube · Mutter · Scheibe · leer oder i. O. · Kratzer · Delle.</text>
</svg>
